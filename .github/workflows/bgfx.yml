name: bgfx Linux Build
'on':
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      version:
        type: string
        required: false
        default: ''
      output_prefix:
        type: string
        required: true
permissions:
  contents: read
jobs:
  linux:
    name: Linux
    runs-on: ${{ matrix.RUNNER }}
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        ARCH: [amd64, arm64]
        include:
        - ARCH: amd64
          OUTPUT_DIR: linux64_gcc
          RUNNER: ubuntu-24.04
          FLAVOR: linux-gcc
          CONFIG: release64
          GCC: 14
        - ARCH: arm64
          RUNNER: ubuntu-24.04-arm
          OUTPUT_DIR: linux_arm_gcc
          FLAVOR: linux-arm-gcc
          CONFIG: release
          GCC: 14
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          DEBIAN_FRONTEND=noninteractive apt-get -yq update
          DEBIAN_FRONTEND=noninteractive apt-get -yq install --no-install-recommends ca-certificates git tar zstd
      - uses: actions/checkout@v7
        with:
          repository: LWJGL-CI/bgfx
          fetch-depth: 4
      - uses: actions/cache@v5
        with:
          path: /var/cache/apt
          key: apt-trixie-v1-bgfx-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-trixie-v1-bgfx-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-
      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get -yq install build-essential  cmake \
            gcc-${{ matrix.GCC }} \
            g++-${{ matrix.GCC }} \
            libc6-dev
      - name: Clone bx & bimg
        run: |
          git clone https://github.com/LWJGL-CI/bx.git ../bx
          git clone https://github.com/LWJGL-CI/bimg.git ../bimg
      - name: Clone and build GENie
        run: |
          git clone https://github.com/LWJGL-CI/GENie.git ../GENie
          cd ../GENie
          if [ "${{ matrix.ARCH }}" = "arm64" ]; then
            # GENie's bootstrap makefile hardcodes the x86-only -m64 option.
            sed -i 's/ -m64//g' build/gmake.linux/genie.make
          fi
          make -j8
      - name: Install compilation dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get -yq install \
            libgl-dev \
            x11proto-dev \
            libx11-dev
      - name: Build bgfx
        run: |
          ../GENie/bin/linux/genie --with-shared-lib --gcc=${{ matrix.FLAVOR }} gmake
          make -j8 -R -C .build/projects/gmake-${{ matrix.FLAVOR }} config=${{ matrix.CONFIG }} \
            CXX="g++-${{ matrix.GCC }}" \
            CC="gcc-${{ matrix.GCC }}" \
            CFLAGS="-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0" \
            bgfx-shared-lib
          strip ".build/${{matrix.OUTPUT_DIR}}/bin/libbgfx-shared-libRelease.so"
      - name: Stage library files
        run: |
          output="dist/${{ inputs.output_prefix }}/linux/${{ matrix.ARCH == 'amd64' && 'x64' || matrix.ARCH }}"
          mkdir -p "$output"
          cp -p ".build/${{matrix.OUTPUT_DIR}}/bin/libbgfx-shared-libRelease.so" "$output/libbgfx.so"
          git config --global --add safe.directory $PWD
          git log --first-parent --pretty=format:%H HEAD~3..HEAD~2 > "$output/libbgfx.so.git"
      - uses: actions/upload-artifact@v7
        with:
          name: native-bgfx-linux-${{ matrix.ARCH }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  linux-cross:
    name: Linux Cross
    runs-on: ubuntu-24.04
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
        - ARCH: ppc64le
          CROSS_ARCH: ppc64el
          TRIPLET: powerpc64le-linux-gnu
          FLAVOR: linux-ppc64le-gcc
          PROCESSOR: powerpc64le
          GCC: 14
          HOST: powerpc64le-linux-gnu
    env:
      LWJGL_ARCH: ${{ matrix.ARCH }}
      MATRIX_FLAVOR: ${{ matrix.FLAVOR }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          DEBIAN_FRONTEND=noninteractive apt-get -yq update
          DEBIAN_FRONTEND=noninteractive apt-get -yq install --no-install-recommends ca-certificates git tar zstd
      - uses: actions/checkout@v7
        with:
          repository: LWJGL-CI/bgfx
          fetch-depth: 4
      - uses: actions/cache@v5
        with:
          path: /var/cache/apt
          key: apt-trixie-v1-bgfx-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-trixie-v1-bgfx-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-
      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get -yq install cmake build-essential \
            gcc-${{ matrix.GCC }}-${{ matrix.TRIPLET }} \
            g++-${{ matrix.GCC }}-${{ matrix.TRIPLET }} \
            libc6-dev-${{ matrix.CROSS_ARCH }}-cross
      - name: Clone bx & bimg
        run: |
          git clone https://github.com/LWJGL-CI/bx.git ../bx --depth=1
          git clone https://github.com/LWJGL-CI/bimg.git ../bimg --depth=1
      - name: Clone and build GENie
        run: |
          git clone https://github.com/LWJGL-CI/GENie.git ../GENie
          cd ../GENie
          make -j8
      - name: Prepare cross-compilation for ${{ matrix.CROSS_ARCH }}
        run: |
          dpkg --add-architecture ${{ matrix.CROSS_ARCH }}
          apt-get update
      - name: Install cross-compilation dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get -yq install \
            libgl-dev:${{ matrix.CROSS_ARCH }} \
            x11proto-dev:${{ matrix.CROSS_ARCH }} \
            libx11-dev:${{ matrix.CROSS_ARCH }}
      - name: Build bgfx for ${{ matrix.CROSS_ARCH }}
        run: |
          sed -i 's/strip -s/${{ matrix.TRIPLET }}-strip/' ../bx/scripts/toolchain.lua
          ../GENie/bin/linux/genie --with-shared-lib --gcc=${{ matrix.FLAVOR }} gmake
          # bx::debugBreak's fallback deliberately writes to an invalid address.
          make -j8 -R -C .build/projects/gmake-${{ matrix.FLAVOR }} config=release \
            CXX="${{ matrix.TRIPLET }}-g++-${{ matrix.GCC }}" \
            CC="${{ matrix.TRIPLET }}-gcc-${{ matrix.GCC }}" \
            CXXFLAGS="-Wno-error=array-bounds" \
            CFLAGS="-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0" \
            bgfx-shared-lib
          ${{ matrix.TRIPLET }}-strip .build/${MATRIX_FLAVOR//-/_}/bin/libbgfx-shared-libRelease.so
      - name: Stage library files
        run: |
          output="dist/${{ inputs.output_prefix }}/linux/${{ matrix.ARCH }}"
          mkdir -p "$output"
          cp -p ".build/${MATRIX_FLAVOR//-/_}/bin/libbgfx-shared-libRelease.so" "$output/libbgfx.so"
          git config --global --add safe.directory $PWD
          git log --first-parent --pretty=format:%H HEAD~3..HEAD~2 > "$output/libbgfx.so.git"
      - uses: actions/upload-artifact@v7
        with:
          name: native-bgfx-linux-cross-${{ matrix.ARCH }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  linux-cross-llvm:
    name: Linux Cross (Clang/LLVM)
    runs-on: ubuntu-24.04
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
        - ARCH: riscv64
          CROSS_ARCH: riscv64
          TRIPLET: riscv64-linux-gnu
          FLAVOR: linux-riscv64-gcc
          PROCESSOR: riscv64
          GCC: 14
          HOST: riscv64-linux-gnu
        - ARCH: loong64
          CROSS_ARCH: loong64
          TRIPLET: loongarch64-linux-gnu
          FLAVOR: linux-loong64-gcc
          PROCESSOR: loongarch64
          GCC: 14
          HOST: loongarch64-linux-gnu
    env:
      LWJGL_ARCH: ${{ matrix.ARCH }}
      MATRIX_FLAVOR: ${{ matrix.FLAVOR }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          DEBIAN_FRONTEND=noninteractive apt-get -yq update
          DEBIAN_FRONTEND=noninteractive apt-get -yq install --no-install-recommends ca-certificates curl git tar zstd
      - uses: actions/checkout@v7
        with:
          repository: LWJGL-CI/bgfx
          fetch-depth: 4
      - uses: actions/cache@v5
        with:
          path: /var/cache/apt
          key: apt-trixie-v1-bgfx-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-trixie-v1-bgfx-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-
      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get -yq install build-essential  cmake \
            clang-18 lld-18 llvm-18 \
            gcc-14-${{ matrix.TRIPLET }} \
            g++-14-${{ matrix.TRIPLET }} \
            libc6-dev-${{ matrix.CROSS_ARCH }}-cross
      - name: Clone bx & bimg
        run: |
          git clone https://github.com/LWJGL-CI/bx.git ../bx --depth=1
          git clone https://github.com/LWJGL-CI/bimg.git ../bimg --depth=1
      - name: Clone and build GENie
        run: |
          git clone https://github.com/LWJGL-CI/GENie.git ../GENie
          cd ../GENie
          make -j8
      - name: Prepare Debian Repository for loong64
        if: matrix.ARCH == 'loong64'
        run: |
          # Official trixie does not carry loong64. Do not request its index there,
          # or install native amd64 packages from the supplemental mirror.
          native=$(dpkg --print-architecture)
          sed -i "/^Types: deb/a Architectures: $native" /etc/apt/sources.list.d/debian.sources
          cat > /etc/apt/sources.list.d/trixie-loong64.sources << "EOF"
          Types: deb
          URIs: http://mirrors.loong64.com/debian
          Suites: trixie trixie-updates
          Components: main
          Architectures: loong64
          # Signed-By: /usr/share/keyrings/debian-loong64-non-official-archive-keyring.pgp

          Types: deb
          URIs: http://mirrors.loong64.com/debian-security
          Suites: trixie-security
          Components: main
          Architectures: loong64
          # Signed-By: /usr/share/keyrings/debian-loong64-non-official-archive-keyring.pgp
          EOF
          dpkg --add-architecture loong64
          apt-get update -o Acquire::AllowInsecureRepositories=true
          apt-get install -y --allow-unauthenticated curl debian-loong64-non-official-archive-keyring
          sed -i 's/# Signed-By/Signed-By/g' /etc/apt/sources.list.d/trixie-loong64.sources
          apt-get update
      - name: Prepare cross-compilation for ${{ matrix.CROSS_ARCH }}
        run: |
          dpkg --add-architecture ${{ matrix.CROSS_ARCH }}
          apt-get update
      - name: Install cross-compilation dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get -yq install \
            libgl-dev:${{ matrix.CROSS_ARCH }} \
            x11proto-dev:${{ matrix.CROSS_ARCH }} \
            libx11-dev:${{ matrix.CROSS_ARCH }}
      - name: Apply bx LoongArch support
        if: matrix.ARCH == 'loong64'
        run: |
          curl --fail --show-error --silent --location \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/patches/bx-loong64.patch" \
            | git -C ../bx apply -
      - name: Build bgfx for ${{ matrix.CROSS_ARCH }}
        run: |
          sed -i 's/strip -s/llvm-strip-18/' ../bx/scripts/toolchain.lua
          ../GENie/bin/linux/genie --with-shared-lib --gcc=${{ matrix.FLAVOR }} gmake
          make -j8 -R -C .build/projects/gmake-${{ matrix.FLAVOR }} config=release \
            CXX="clang++-18" \
            CC="clang-18" \
            AR="llvm-ar-18" \
            RANLIB="llvm-ranlib-18" \
            CFLAGS="--target=${{ matrix.TRIPLET }} -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0" \
            LDFLAGS="--target=${{ matrix.TRIPLET }}" \
            bgfx-shared-lib
          llvm-strip-18 .build/${MATRIX_FLAVOR//-/_}/bin/libbgfx-shared-libRelease.so
      - name: Stage library files
        run: |
          output="dist/${{ inputs.output_prefix }}/linux/${{ matrix.ARCH }}"
          mkdir -p "$output"
          cp -p ".build/${MATRIX_FLAVOR//-/_}/bin/libbgfx-shared-libRelease.so" "$output/libbgfx.so"
          git config --global --add safe.directory $PWD
          git log --first-parent --pretty=format:%H HEAD~3..HEAD~2 > "$output/libbgfx.so.git"
      - uses: actions/upload-artifact@v7
        with:
          name: native-bgfx-linux-cross-llvm-${{ matrix.ARCH }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
