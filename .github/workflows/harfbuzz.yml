name: harfbuzz Linux Build
'on':
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      version:
        type: string
        required: false
        default: ''
      output_prefix:
        type: string
        required: true
permissions:
  contents: read
env:
  HARFBUZZ_PARAMS: --wrap-mode=default --force-fallback-for=libpng,zlib -Dlibpng:default_library=static -Dzlib:default_library=static
    -Dfreetype=disabled -Dsubset=disabled -Dtests=disabled -Dbenchmark=disabled -Ddocs=disabled -Dexperimental_api=true
    --buildtype=release -Db_lto=true -Db_ndebug=true
jobs:
  linux:
    name: Linux
    runs-on: ${{ matrix.RUNNER }}
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        ARCH: [amd64, arm64]
        include:
        - ARCH: amd64
          RUNNER: ubuntu-24.04
          GCC: 14
        - ARCH: arm64
          RUNNER: ubuntu-24.04-arm
          GCC: 14
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          DEBIAN_FRONTEND=noninteractive apt-get -yq update
          DEBIAN_FRONTEND=noninteractive apt-get -yq install --no-install-recommends ca-certificates git tar zstd
      - uses: actions/checkout@v7
        with:
          repository: LWJGL-CI/harfbuzz
          fetch-depth: 3
      - uses: actions/cache@v5
        with:
          path: /var/cache/apt
          key: apt-trixie-v1-harfbuzz-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-trixie-v1-harfbuzz-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-
      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get -yq install ninja-build python3-pip \
            gcc-${{ matrix.GCC }} \
            g++-${{ matrix.GCC }} \
            libc6-dev
      - name: Install meson
        run: pip3 install meson --break-system-packages
      - name: Configure build
        run: |
          meson setup build $HARFBUZZ_PARAMS
      - name: Build
        run: |
          meson compile --verbose -C build
          strip build/src/libharfbuzz.so
      - name: Stage library files
        run: |
          output="dist/${{ inputs.output_prefix }}/linux/${{ matrix.ARCH == 'amd64' && 'x64' || matrix.ARCH }}"
          mkdir -p "$output"
          cp -p "build/src/libharfbuzz.so" "$output/libharfbuzz.so"
          cp -p "build/src/libharfbuzz-gpu.so" "$output/libharfbuzz-gpu.so"
          cp -p "build/src/libharfbuzz-raster.so" "$output/libharfbuzz-raster.so"
          cp -p "build/src/libharfbuzz-vector.so" "$output/libharfbuzz-vector.so"
          git config --global --add safe.directory $(pwd)
          git log --first-parent --pretty=format:%H HEAD~2..HEAD~1 > "$output/libharfbuzz.so.git"
      - uses: actions/upload-artifact@v7
        with:
          name: native-harfbuzz-linux-${{ matrix.ARCH }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  linux-cross:
    name: Linux Cross
    runs-on: ubuntu-24.04
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
        - ARCH: ppc64le
          CROSS_ARCH: ppc64el
          TRIPLET: powerpc64le-linux-gnu
          GCC: 14
          PROCESSOR: powerpc64le
          HOST: powerpc64le-linux-gnu
        - ARCH: riscv64
          CROSS_ARCH: riscv64
          TRIPLET: riscv64-linux-gnu
          GCC: 14
          PROCESSOR: riscv64
          HOST: riscv64-linux-gnu
        - ARCH: loong64
          CROSS_ARCH: loong64
          TRIPLET: loongarch64-linux-gnu
          GCC: 14
          PROCESSOR: loongarch64
          HOST: loongarch64-linux-gnu
        - ARCH: s390x
          CROSS_ARCH: s390x
          TRIPLET: s390x-linux-gnu
          GCC: 14
          PROCESSOR: s390x
          HOST: s390x-linux-gnu
    env:
      LWJGL_ARCH: ${{ matrix.ARCH }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          DEBIAN_FRONTEND=noninteractive apt-get -yq update
          DEBIAN_FRONTEND=noninteractive apt-get -yq install --no-install-recommends ca-certificates git tar zstd
      - uses: actions/checkout@v7
        with:
          repository: LWJGL-CI/harfbuzz
          fetch-depth: 3
      - uses: actions/cache@v5
        with:
          path: /var/cache/apt
          key: apt-trixie-v1-harfbuzz-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-trixie-v1-harfbuzz-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-
      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get -yq install ninja-build python3-pip \
            gcc-${{ matrix.GCC }}-${{ matrix.TRIPLET }} \
            g++-${{ matrix.GCC }}-${{ matrix.TRIPLET }} \
            libc6-dev-${{ matrix.CROSS_ARCH }}-cross
      - name: Install meson
        run: pip3 install meson --break-system-packages
      - name: Prepare build
        run: |
          if [ ! -f "lwjgl_linux_${{ matrix.ARCH }}.cross" ]; then
            cp lwjgl_linux_arm64.cross lwjgl_linux_${{ matrix.ARCH }}.cross
            sed -i "s/aarch64/${{ matrix.PROCESSOR }}/g" lwjgl_linux_${{ matrix.ARCH }}.cross
            sed -i "s/arm64/${{ matrix.ARCH }}/g" lwjgl_linux_${{ matrix.ARCH }}.cross
          fi
          if [ "${{ matrix.ARCH }}" = "s390x" ]; then
            sed -i "s/little/big/g" lwjgl_linux_${{ matrix.ARCH }}.cross
          fi
          sed -i "s/12/${{ matrix.GCC }}/g" lwjgl_linux_${{ matrix.ARCH }}.cross
      - name: Configure build
        run: |
          export PKG_CONFIG_LIBDIR="/usr/lib/${{ matrix.TRIPLET }}/pkgconfig:/usr/share/pkgconfig"
          meson setup build $HARFBUZZ_PARAMS --cross-file lwjgl_linux_${{ matrix.ARCH }}.cross
      - name: Build
        run: |
          meson compile --verbose -C build
          ${{ matrix.TRIPLET }}-strip build/src/libharfbuzz.so
      - name: Stage library files
        run: |
          output="dist/${{ inputs.output_prefix }}/linux/${{ matrix.ARCH }}"
          mkdir -p "$output"
          cp -p "build/src/libharfbuzz.so" "$output/libharfbuzz.so"
          cp -p "build/src/libharfbuzz-gpu.so" "$output/libharfbuzz-gpu.so"
          cp -p "build/src/libharfbuzz-raster.so" "$output/libharfbuzz-raster.so"
          cp -p "build/src/libharfbuzz-vector.so" "$output/libharfbuzz-vector.so"
          git config --global --add safe.directory $(pwd)
          git log --first-parent --pretty=format:%H HEAD~2..HEAD~1 > "$output/libharfbuzz.so.git"
      - uses: actions/upload-artifact@v7
        with:
          name: native-harfbuzz-linux-cross-${{ matrix.ARCH }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
