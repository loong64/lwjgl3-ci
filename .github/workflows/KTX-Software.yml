name: KTX-Software Linux Build
'on':
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      version:
        type: string
        required: false
        default: ''
      output_prefix:
        type: string
        required: true
permissions:
  contents: read
env:
  KTX_CMAKE_PARAMS: -DBASISU_SUPPORT_OPENCL=OFF -DKTX_FEATURE_TESTS=OFF -DKTX_FEATURE_TOOLS=OFF
jobs:
  linux:
    name: Linux
    runs-on: ${{ matrix.RUNNER }}
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        ARCH: [amd64, arm64]
        include:
        - ARCH: amd64
          ISA_CMAKE_PARAMS: -DASTCENC_ISA_AVX2=ON -DASTCENC_ISA_SSE41=ON -DASTCENC_ISA_SSE2=ON
          RUNNER: ubuntu-24.04
          GCC: 14
        - ARCH: arm64
          RUNNER: ubuntu-24.04-arm
          ISA_CMAKE_PARAMS: -DASTCENC_ISA_NEON=OFF -DASTCENC_ISA_NONE=ON
          GCC: 14
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          DEBIAN_FRONTEND=noninteractive apt-get -yq update
          DEBIAN_FRONTEND=noninteractive apt-get -yq install --no-install-recommends ca-certificates git tar zstd
      - uses: actions/checkout@v7
        with:
          repository: LWJGL-CI/KTX-Software
          fetch-depth: 3
      - uses: actions/cache@v5
        with:
          path: /var/cache/apt
          key: apt-trixie-v1-KTX-Software-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-trixie-v1-KTX-Software-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-
      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get -yq install cmake \
            gcc-${{ matrix.GCC }} \
            g++-${{ matrix.GCC }} \
            libc6-dev
      - name: Fetch tags
        run: |
          git config --global --add safe.directory $(pwd)
          git remote add upstream https://github.com/KhronosGroup/KTX-Software.git
          git fetch --all --tags
      - name: Configure build
        run: |
          CC=gcc-${{ matrix.GCC }} CXX=g++-${{ matrix.GCC }} cmake -B build \
            $KTX_CMAKE_PARAMS \
            ${{ matrix.ISA_CMAKE_PARAMS }} \
            -DCMAKE_C_FLAGS:STRING="${CMAKE_C_FLAGS} -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0"
      - name: Build
        run: |
          cmake --build build --parallel --target ktx
          strip build/libktx.so
      - name: Stage library files
        run: |
          output="dist/${{ inputs.output_prefix }}/linux/${{ matrix.ARCH == 'amd64' && 'x64' || matrix.ARCH }}"
          mkdir -p "$output"
          cp -p "build/libktx.so" "$output/libktx.so"
          git log --first-parent --pretty=format:%H HEAD~2..HEAD~1 > "$output/libktx.so.git"
      - uses: actions/upload-artifact@v7
        with:
          name: native-KTX-Software-linux-${{ matrix.ARCH }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  linux-cross:
    name: Linux Cross
    runs-on: ubuntu-24.04
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
        - ARCH: ppc64le
          CROSS_ARCH: ppc64el
          TRIPLET: powerpc64le-linux-gnu
          GCC: 14
          ISA_CMAKE_PARAMS: -DASTCENC_ISA_NONE=ON
          PROCESSOR: powerpc64le
          HOST: powerpc64le-linux-gnu
        - ARCH: riscv64
          CROSS_ARCH: riscv64
          TRIPLET: riscv64-linux-gnu
          GCC: 14
          ISA_CMAKE_PARAMS: -DASTCENC_ISA_NONE=ON
          PROCESSOR: riscv64
          HOST: riscv64-linux-gnu
        - ARCH: loong64
          CROSS_ARCH: loong64
          TRIPLET: loongarch64-linux-gnu
          GCC: 14
          ISA_CMAKE_PARAMS: -DASTCENC_ISA_NONE=ON
          PROCESSOR: loongarch64
          HOST: loongarch64-linux-gnu
        - ARCH: s390x
          CROSS_ARCH: s390x
          TRIPLET: s390x-linux-gnu
          GCC: 14
          ISA_CMAKE_PARAMS: -DASTCENC_ISA_NONE=ON
          PROCESSOR: s390x
          HOST: s390x-linux-gnu
    env:
      LWJGL_ARCH: ${{ matrix.ARCH }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          DEBIAN_FRONTEND=noninteractive apt-get -yq update
          DEBIAN_FRONTEND=noninteractive apt-get -yq install --no-install-recommends ca-certificates git tar zstd
      - uses: actions/checkout@v7
        with:
          repository: LWJGL-CI/KTX-Software
          fetch-depth: 3
      - uses: actions/cache@v5
        with:
          path: /var/cache/apt
          key: apt-trixie-v1-KTX-Software-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-trixie-v1-KTX-Software-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-
      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get -yq install cmake \
            gcc-${{ matrix.GCC }}-${{ matrix.TRIPLET }} \
            g++-${{ matrix.GCC }}-${{ matrix.TRIPLET }} \
            libc6-dev-${{ matrix.CROSS_ARCH }}-cross
      - name: Fetch tags
        run: |
          git config --global --add safe.directory $(pwd)
          git remote add upstream https://github.com/KhronosGroup/KTX-Software.git
          git fetch --all --tags
      - name: Configure build
        run: |
          export PKG_CONFIG_LIBDIR="/usr/lib/${{ matrix.TRIPLET }}/pkgconfig:/usr/share/pkgconfig"
          CC=${{ matrix.TRIPLET }}-gcc-${{ matrix.GCC }} CXX=${{ matrix.TRIPLET }}-g++-${{ matrix.GCC }} cmake -B build \
            $KTX_CMAKE_PARAMS \
            ${{ matrix.ISA_CMAKE_PARAMS }} \
            -DCMAKE_C_FLAGS:STRING="${CMAKE_C_FLAGS} -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0"
      - name: Build
        run: |
          cmake --build build --parallel --target ktx
          ${{ matrix.TRIPLET }}-strip build/libktx.so
      - name: Stage library files
        run: |
          output="dist/${{ inputs.output_prefix }}/linux/${{ matrix.ARCH }}"
          mkdir -p "$output"
          cp -p "build/libktx.so" "$output/libktx.so"
          git log --first-parent --pretty=format:%H HEAD~2..HEAD~1 > "$output/libktx.so.git"
      - uses: actions/upload-artifact@v7
        with:
          name: native-KTX-Software-linux-cross-${{ matrix.ARCH }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
