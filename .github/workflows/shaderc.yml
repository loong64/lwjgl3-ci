name: shaderc Linux Build
'on':
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      version:
        type: string
        required: false
        default: ''
      output_prefix:
        type: string
        required: true
permissions:
  contents: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  SHADERC_PARAMS: -DSHADERC_SKIP_INSTALL=ON -DSHADERC_SKIP_TESTS=ON
jobs:
  linux:
    name: Linux
    runs-on: ${{ matrix.RUNNER }}
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        ARCH: [amd64, arm64]
        include:
        - ARCH: amd64
          RUNNER: ubuntu-24.04
          GCC: 14
          CMAKE_FLAGS: ''
        - ARCH: arm64
          RUNNER: ubuntu-24.04-arm
          GCC: 14
          CMAKE_FLAGS: ''
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          DEBIAN_FRONTEND=noninteractive apt-get -yq update
          DEBIAN_FRONTEND=noninteractive apt-get -yq install --no-install-recommends ca-certificates git tar zstd
      - uses: actions/checkout@v7
        with:
          repository: LWJGL-CI/shaderc
          fetch-depth: 3
      - uses: actions/cache@v5
        with:
          path: /var/cache/apt
          key: apt-trixie-v1-shaderc-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-trixie-v1-shaderc-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-
      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get -yq install cmake  python3 \
            gcc-${{ matrix.GCC }} \
            g++-${{ matrix.GCC }} \
            libc6-dev
      - name: Sync deps
        run: |
          git config --global --add safe.directory $(pwd)
          python3 utils/git-sync-deps
      - name: Configure build
        run: |
          CC=gcc-${{ matrix.GCC }} CXX=g++-${{ matrix.GCC }} ${{matrix.CMAKE_FLAGS}} cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0" \
            $SHADERC_PARAMS
      - name: Build
        run: |
          cmake --build build
          strip build/libshaderc/libshaderc_shared.so
      - name: Stage library files
        run: |
          output="dist/${{ inputs.output_prefix }}/linux/${{ matrix.ARCH == 'amd64' && 'x64' || matrix.ARCH }}"
          mkdir -p "$output"
          cp -p "build/libshaderc/libshaderc_shared.so" "$output/libshaderc.so"
          git rev-parse HEAD > "$output/libshaderc.so.git"
      - uses: actions/upload-artifact@v7
        with:
          name: native-shaderc-linux-${{ matrix.ARCH }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  linux-cross:
    name: Linux Cross
    runs-on: ubuntu-24.04
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
        - ARCH: ppc64le
          CROSS_ARCH: ppc64el
          TRIPLET: powerpc64le-linux-gnu
          GCC: 14
          CMAKE_FLAGS: ''
          PROCESSOR: powerpc64le
          HOST: powerpc64le-linux-gnu
        - ARCH: riscv64
          CROSS_ARCH: riscv64
          TRIPLET: riscv64-linux-gnu
          GCC: 14
          CMAKE_FLAGS: LDFLAGS=-pthread
          PROCESSOR: riscv64
          HOST: riscv64-linux-gnu
        - ARCH: loong64
          CROSS_ARCH: loong64
          TRIPLET: loongarch64-linux-gnu
          GCC: 14
          CMAKE_FLAGS: ''
          PROCESSOR: loongarch64
          HOST: loongarch64-linux-gnu
        - ARCH: s390x
          CROSS_ARCH: s390x
          TRIPLET: s390x-linux-gnu
          GCC: 14
          CMAKE_FLAGS: ''
          PROCESSOR: s390x
          HOST: s390x-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          DEBIAN_FRONTEND=noninteractive apt-get -yq update
          DEBIAN_FRONTEND=noninteractive apt-get -yq install --no-install-recommends ca-certificates git tar zstd
      - uses: actions/checkout@v7
        with:
          repository: LWJGL-CI/shaderc
          fetch-depth: 3
      - uses: actions/cache@v5
        with:
          path: /var/cache/apt
          key: apt-trixie-v1-shaderc-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-trixie-v1-shaderc-${{ github.job }}-${{ runner.arch }}-${{ matrix.ARCH }}-
      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get -yq install cmake  python3 \
            gcc-${{ matrix.GCC }}-${{ matrix.TRIPLET }} \
            g++-${{ matrix.GCC }}-${{ matrix.TRIPLET }} \
            libc6-dev-${{ matrix.CROSS_ARCH }}-cross
      - name: Sync deps
        run: |
          git config --global --add safe.directory $(pwd)
          python3 utils/git-sync-deps
      - name: Configure build
        run: |
          export PKG_CONFIG_LIBDIR="/usr/lib/${{ matrix.TRIPLET }}/pkgconfig:/usr/share/pkgconfig"
          CC=${{ matrix.TRIPLET }}-gcc-${{ matrix.GCC }} CXX=${{ matrix.TRIPLET }}-g++-${{ matrix.GCC }} ${{matrix.CMAKE_FLAGS}} cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0" \
            $SHADERC_PARAMS
      - name: Build
        run: |
          cmake --build build
          ${{ matrix.TRIPLET }}-strip build/libshaderc/libshaderc_shared.so
      - name: Stage library files
        run: |
          output="dist/${{ inputs.output_prefix }}/linux/${{ matrix.ARCH }}"
          mkdir -p "$output"
          cp -p "build/libshaderc/libshaderc_shared.so" "$output/libshaderc.so"
          git rev-parse HEAD > "$output/libshaderc.so.git"
      - uses: actions/upload-artifact@v7
        with:
          name: native-shaderc-linux-cross-${{ matrix.ARCH }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
